:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --soft:#EEF2F7; --line:#DDE3EC; --frame:#9AA6BC;
  --text:#14213A; --muted:#51607A; --accent:#2F4FC4; --accent-weak:#EAEFFD;
  --ok:#14663A; --ok-bg:#DDF5E6; --warn:#8A4B08; --warn-bg:#FDF0CC; --bad:#A8261B; --bad-bg:#FCE4E1;
  --r-lg:16px; --r-md:12px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
fieldset{border:0;padding:0;margin:0;min-width:0}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Sarabun",system-ui,"Segoe UI","Leelawadee UI",sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ul,ol,dl,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:8px 20px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;font-size:17px;line-height:1.4;color:var(--text);white-space:nowrap}
.brand.is-back{color:var(--accent)}
#bar{display:flex;align-items:center;gap:12px;min-width:0}
.bar-site{font-weight:600;font-size:17px;line-height:1.4;white-space:nowrap}
.who{display:flex;gap:6px}
.sample{font-size:14px;line-height:1.4;color:var(--muted);background:var(--soft);padding:4px 10px;border-radius:999px;white-space:nowrap}

main{max-width:760px;margin:0 auto;padding:24px 20px 72px}
h1{font-size:28px;line-height:1.35;font-weight:600}
.sub{color:var(--muted);font-size:16px}
.src{margin-top:28px;color:var(--muted);font-size:14px}
.src .tag{margin-right:6px}

.search{margin-top:20px}
.field{display:block;width:100%;min-height:48px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);line-height:1.5}
.field[readonly]{background:var(--soft);border-color:var(--soft)}
.field.is-empty{color:var(--muted)}
.field.is-bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.field.is-warn{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.field.is-auto{background:var(--soft);border-color:var(--soft)}
textarea.field{min-height:84px;resize:vertical}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{min-height:44px;padding:8px 16px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:15px;line-height:1.4;white-space:nowrap;cursor:pointer}
.chip.is-on{background:var(--accent);border-color:var(--accent);color:#FFFFFF}

.list{margin-top:16px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;color:var(--text)}
.row-top{font-weight:600;font-size:18px;line-height:1.4}
.row-meta{justify-self:end}
.row-sub{grid-column:1 / -1;display:flex;flex-wrap:wrap;column-gap:14px;color:var(--muted);font-size:15px}
.nb{white-space:nowrap}
.tag{display:inline-block;font-size:14px;line-height:1.4;padding:3px 12px;border-radius:999px;background:var(--accent-weak);color:var(--accent);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.quiet{background:var(--soft);color:var(--muted)}
.empty{margin-top:16px;color:var(--muted)}

.old{margin-top:20px;background:var(--soft);border-radius:var(--r-lg);padding:16px 18px}
.old .tag.quiet{background:var(--surface)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:12px 16px}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-weight:600}

.group{margin-top:32px;font-size:15px;color:var(--muted)}
.steps{margin-top:10px;display:grid;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.step-head{display:grid;grid-template-columns:44px 1fr auto;column-gap:8px;align-items:baseline}
.no{color:var(--muted);font-size:15px}
.step-name{font-size:18px;line-height:1.4;font-weight:600}
.step-note{grid-column:2;color:var(--muted);font-size:15px}
.step.is-done{background:transparent;padding:12px 18px}
.step.is-done .step-name{font-weight:400}
.step.is-done .step-head::after{content:"";grid-column:3;grid-row:1;align-self:center;width:6px;height:12px;margin:0 6px 4px 0;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.step.is-sum .step-name,.step.is-sum .step-note{grid-column:1 / 3}
.step.is-next{background:transparent;border-style:dashed}
.step.is-next .step-name{font-weight:400;color:var(--muted)}
.step.is-out{background:transparent;padding:12px 18px}
.step.is-out .step-name{font-weight:400;color:var(--muted)}
.step.is-now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);scroll-margin-top:72px}
.step.is-now .no{color:var(--accent);font-weight:600}
.step.is-view{border-color:var(--frame);box-shadow:none}
.step.is-view .no{color:var(--muted)}
.body{margin-top:16px;display:grid;gap:16px}
.body > .ghost,.stack > .ghost{justify-self:start}
.stack{display:grid;gap:14px}
.lead{color:var(--text)}

.lab{display:block;color:var(--muted);font-size:15px;margin-bottom:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hint{color:var(--muted);font-size:14px}
.hint.bad{display:block;margin-top:6px;color:var(--bad)}
.hint.warn{display:block;margin-top:6px;color:var(--warn)}
.hint .tag{margin-left:6px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:block}
.tile input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tile > span{display:block;min-height:56px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);line-height:1.5}
.tile input:checked + span{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.tile input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
/* ตัวเลือกแบบเลือกข้อเดียวมีวงกลมหน้าคำ จะได้ไม่ดูเหมือนช่องกรอกที่มีค่าอยู่แล้ว */
/* กล่องกับวงกลมผูกกับ span ลูกตรงของ label เท่านั้น ก้อนห้ามตัดคำที่ห่อในป้าย (ผู้เซ็น) จะได้ไม่กลายเป็นกล่องซ้อน (เห็นจากภาพรุ่น 7 , 01/10) */
.tile.radio > span{position:relative;padding-left:48px}
.tile.radio > span::before{content:"";position:absolute;left:16px;top:50%;width:20px;height:20px;margin-top:-10px;border:2px solid var(--muted);border-radius:50%;background:var(--surface)}
.tile.radio input:checked + span::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
#id-wrap{margin-top:8px}
.tile.check input:checked + span{border-color:var(--line);background:var(--surface);color:var(--text)}
.tile.check > span{position:relative;padding-left:52px}
.tile.check > span::before{content:"";position:absolute;left:16px;top:50%;width:22px;height:22px;margin-top:-11px;border:2px solid var(--muted);border-radius:6px;background:var(--surface)}
.tile.check input:checked + span::before{border-color:var(--accent);background:var(--accent)}
.tile.check input:checked + span::after{content:"";position:absolute;left:24px;top:50%;width:6px;height:12px;margin-top:-9px;border:solid #FFFFFF;border-width:0 2px 2px 0;transform:rotate(45deg)}

.cmp{display:grid;gap:10px}
.cmp-row{display:grid;gap:8px;padding:12px 14px;background:var(--soft);border-radius:var(--r-md)}
.cmp-h{font-weight:600}
.cmp-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:start}
.cell{display:grid;grid-template-rows:auto 48px;align-content:start}
.cell small{color:var(--muted);font-size:14px;line-height:1.5}
.cell .v{display:flex;align-items:center}

.paper{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-md);padding:22px 22px;font-size:15px;line-height:1.75}
.paper p + p,.paper ol{margin-top:8px}
.paper ol{list-style:decimal;padding-left:22px}
.paper .r{text-align:right}
.paper mark{background:var(--accent-weak);color:var(--text);padding:0 4px;border-radius:4px;white-space:nowrap}
.paper-cap{color:var(--muted);font-size:14px;margin-bottom:6px}
/* รุ่น 10: ใบตอบรับกับแบบฟอร์มแจ้งรายละเอียดออกพร้อมหนังสือ พับไว้ให้ปุ่มส่งไม่ถูกดันลงไกล */
/* หัวพับไม่ใช้ flex เพราะก้อนห้ามตัดคำกลายเป็นคอลัมน์แยกกัน (ภาพ 390 รุ่น 10 ร่างแรก) */
.sheets > summary{cursor:pointer;color:var(--accent);min-height:44px;padding:10px 0;font-size:15px;line-height:1.5}
.sheet{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;font-size:14px;line-height:1.7;margin-top:10px}
.sheet .c{font-weight:600;text-align:center}
.sheet p + p,.sheet ul{margin-top:6px}
.sheet mark{background:var(--accent-weak);color:var(--text);padding:0 4px;border-radius:4px;white-space:nowrap}
.paper mark.w,.sheet mark.w{white-space:normal}

.docs{display:grid;gap:8px}
.doc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 14px;background:var(--soft);border-radius:var(--r-md)}

.btn{display:block;width:100%;min-height:56px;padding:12px 20px;border:0;border-radius:var(--r-md);background:var(--accent);color:#FFFFFF;font-size:18px;line-height:1.4;font-weight:600;cursor:pointer;text-align:center}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.ghost{min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--accent);font-size:15px;line-height:1.4;cursor:pointer;white-space:nowrap}
.ghost.is-set{border-color:var(--ok-bg);background:var(--ok-bg);color:var(--ok)}
.link{background:none;border:0;padding:10px 0;color:var(--accent);font-size:15px;line-height:1.5;cursor:pointer;text-align:left}
.alert{padding:12px 14px;border-radius:var(--r-md);background:var(--bad-bg);color:var(--bad)}
.note{padding:12px 14px;border-radius:var(--r-md);background:var(--soft);color:var(--text);font-size:15px}
.miss{margin-bottom:-6px}
.demo{padding-top:4px;border-top:1px dashed var(--line);color:var(--muted);font-size:14px}
.demo .link{min-height:44px;padding:10px 0 10px 8px;font-size:14px}

.pad-wrap{position:relative}
.pad{display:block;width:100%;height:180px;background:#FFFFFF;border:1px dashed var(--muted);border-radius:var(--r-md);touch-action:none;cursor:crosshair}
.pad-tip{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;pointer-events:none}
.track{display:grid;gap:6px}
.track li{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:baseline;color:var(--muted);font-size:15px}
.track li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);justify-self:center;align-self:center}
.track li.ok{color:var(--text)}
.track li.ok::before{background:var(--ok)}
.track li.bad{color:var(--bad)}
.track li.bad::before{background:var(--bad)}
.track li.warn{color:var(--warn)}
.track li.warn::before{background:var(--warn)}
.track li.now{color:var(--accent);font-weight:600}
.track li.now::before{background:var(--accent)}
.track small{margin-left:6px;color:var(--muted);font-size:14px;font-weight:400}
.log{display:grid;gap:6px;font-size:15px}
.log li{padding:8px 12px;background:var(--soft);border-radius:var(--r-md)}
/* ป้ายกรณีพิเศษบนงาน (ร-10) เป็นกรอบบาง แยกจากป้ายสถานะที่เป็นพื้นสี */
.row-case{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.case{display:inline-block;font-size:13px;line-height:1.4;padding:2px 10px;border:1px solid var(--frame);border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
/* อยู่นอกตาราง kv เพราะแถวที่กินเต็มแถวทำให้ auto-fit ไม่ยุบคอลัมน์ว่าง ค่าเช่าเดิมตกบรรทัด (เห็นที่ 1024 , 01/10) */
.old-case{margin-top:12px}
.old-case .lab{font-size:14px;margin-bottom:4px}
.cases{display:flex;flex-wrap:wrap;gap:6px}
.old + .note{margin-top:12px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.ghost[disabled]{color:var(--muted);cursor:not-allowed}
.exc{display:grid;gap:12px;padding-top:12px;border-top:1px dashed var(--line)}

.assume{margin-top:20px}
.assume li{display:grid;grid-template-columns:44px 1fr;column-gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;top:68px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);z-index:6;background:var(--text);color:#FFFFFF;padding:10px 18px;border-radius:999px;font-size:15px;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.is-on{opacity:1}

@media (max-width:640px){.tiles{grid-template-columns:1fr}}
@media (max-width:480px){
  .top-in{padding:8px 16px}
  main{padding:20px 16px 72px}
  .row{padding:12px 14px}
  .step{padding:14px}
  .step.is-done,.step.is-out{padding:10px 14px}
  .doc{padding:10px 12px;font-size:15px}
  .doc .ghost{padding:8px 12px}
  .cmp-c > label.cell{grid-column:1 / -1}
}
/* จอแคบมาก: คู่ค่าเรียงคอลัมน์เดียว ค่าเงินกับหน่วยจะไม่ขาดจากกัน ลูกศรกลับเหลือแค่ลูกศร */
@media (max-width:360px){
  .kv{grid-template-columns:1fr}
  .brand.is-back .lbl{display:none}
}
</style>

<script>
// ตัวอย่างหน้าจอสำหรับคุยในที่ประชุม ไม่มีการเชื่อมระบบจริง ข้อมูลทุกตัวเป็นข้อมูลสมมติ
const MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const MONL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
function day(y, m, d) { return new Date(Date.UTC(y - 543, m - 1, d)); }
const fmt = d => `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear() + 543}`;
const fmtLong = d => `${d.getUTCDate()} ${MONL[d.getUTCMonth()]} ${d.getUTCFullYear() + 543}`;
const plusDays = (d, n) => new Date(d.getTime() + n * 864e5);
const plusYears = (d, n) => new Date(Date.UTC(d.getUTCFullYear() + n, d.getUTCMonth(), d.getUTCDate()));
const num = n => n.toLocaleString('th-TH');
const baht = n => num(n) + ' บาทต่อปี';
const numOf = s => parseInt(String(s).replace(/[^\d]/g, ''), 10) || 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// วันที่ในข้อความบนจอห้ามตัดกลางวันที่
const fd = d => `<span class="nb">${fmt(d)}</span>`;
// อ่านวันที่ที่พิมพ์แบบ 25 ก.ย. 2569 อ่านไม่ได้คืน null
function parseTh(s) {
  const m = String(s).trim().match(/^(\d{1,2})\s*(\S+?)\s*(\d{4})$/);
  const mi = m ? MON.indexOf(m[2]) : -1;
  return mi < 0 ? null : day(+m[3], mi + 1, +m[1]);
}
const opts = (list, sel) => list.map(o => `<option${o === sel ? ' selected' : ''}>${o}</option>`).join('');
// รุ่น 10: หนังสือจริงเสนอชำระราย 3 เดือนโดยการโอนเงินเข้าบัญชีธนาคาร (แบบฟอร์มที่พี่ปอนด์ส่งมา 02/10/2026)
const TERMS = ['1 ปี', '3 ปี', '5 ปี'], PAYS = ['รายปี', 'ราย 3 เดือน', 'รายเดือน'];
// ทางส่งหนังสือกับทางที่ผู้ให้เช่าตอบกลับ ตามคำเล่าของเจ้าของงาน (ส่งไปรษณีย์แล้วส่งกลับ หรือส่งอีเมลแล้วตอบอีเมล)
const VIAS = ['ไปรษณีย์', 'อีเมล'], RVIAS = ['ไปรษณีย์', 'อีเมล', 'ต่อหน้า'];
const viaText = v => v === 'ต่อหน้า' ? 'ต่อหน้า' : 'ทาง' + v;
// ผู้ให้เช่าไม่ต่อแต่บริษัทยังรื้อถอนไม่ทัน ขอขยายระยะเวลา คำเล่ายกตัวอย่าง 3 หรือ 6 เดือน
const EXT_MONTHS = ['3 เดือน', '6 เดือน', '9 เดือน', '12 เดือน'];
const plusMonths = (d, n) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, d.getUTCDate()));
// ค่าเช่าเป็นตัวอักษรแบบที่หนังสือจริงพิมพ์ (เจ็ดหมื่นห้าร้อยหกสิบบาทถ้วน) ตัวตรวจเทียบกับ num2words ภาษาไทย
const TH_DIG = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], TH_POS = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
function thaiNum(n, higher) {
  if (n >= 1e6) return thaiNum(Math.floor(n / 1e6), false) + 'ล้าน' + thaiNum(n % 1e6, true);
  const s = String(n);
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const d = +s[i], p = s.length - 1 - i;
    if (!d) continue;
    if (p === 0 && d === 1 && (higher || s.length > 1)) out += 'เอ็ด';
    else if (p === 1 && d === 2) out += 'ยี่สิบ';
    else if (p === 1 && d === 1) out += 'สิบ';
    else out += TH_DIG[d] + TH_POS[p];
  }
  return out;
}
const thaiWords = n => n ? thaiNum(n, false) : 'ศูนย์';
// คำอ่านยาวตัดบรรทัดได้แค่รอยต่อหลัก (เจ็ดหมื่น/สองพัน/บาทถ้วน) ร่างแรกตัดกลางหลักเป็น สอง/พัน ที่ 390
const WCHUNK = /(?:หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|ยี่)?(?:สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)|เอ็ด|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|ศูนย์|บาทถ้วน/g;
const wordsHtml = s => s.replace(WCHUNK, c => `<span class="nb">${c}</span>`);
const TODAY = day(2569, 9, 30);

const FLOW = ['letter', 'response', 'nego', 'docs', 'pre', 'review', 'contract', 'sign', 'check', 'done'];
const STEP = {
  letter:   { no: '01', name: 'ออกหนังสือ' },
  response: { no: '02', name: 'คำตอบผู้ให้เช่า' },
  nego:     { no: '03', name: 'ต่อรอง' },
  docs:     { no: '04', name: 'เอกสารประกอบ' },
  pre:      { no: '05', name: 'ร่างสัญญา' },
  review:   { no: '', name: 'ตรวจและอนุมัติ' },
  contract: { no: '06', name: 'ออกสัญญา' },
  sign:     { no: '07', name: 'เซ็นสัญญา' },
  check:    { no: '', name: 'ตรวจสัญญาที่เซ็นแล้ว' },
};
// ขั้นตรวจที่เครื่องมือแสดงให้ดูอย่างเดียว ชื่อทีมตามคำเล่าของเจ้าของงาน
const GATES = {
  review: [['CDC ตรวจร่างสัญญา', ''], ['DQM Review', 'ทีม Vendor ตรวจใน SMT ตามคำเล่า รอยืนยัน'], ['DQM Head Review', 'ทีม CPA'], ['E-Approval', 'อนุมัติการจ่ายเงิน'],
           ['Head of Payment Review', 'ทีม CPA'], ['Head of SMT Review', ''], ['Pre-contract First Payment', ''],
           // รุ่น 9: ผังของคนทำระบบ SAR ให้ SMT ส่งข้อมูลฉบับอนุมัติกลับเข้า SAR ก่อนขั้นเซ็น
           ['Interface data', 'SMT ส่งข้อมูลกลับ SAR ตามผังของคนทำระบบ']],
  check: [['CDC ตรวจสัญญาที่เซ็นแล้ว', ''], ['Review Completed Contract', 'ใน SMT'], ['Completed Contract', 'ทีม CPA'],
          // รุ่น 9: ผังของคนทำระบบจบที่บันทึกเลขสัญญากลับเข้า SAR ตารางสถานะเดิมไม่มีขั้นนี้
          ['Update Contract Code', 'บันทึกเลขสัญญากลับ SAR ตามผังของคนทำระบบ']],
};
// เครื่องหมาย | คือจุดที่ยอมให้ตัดบรรทัดเมื่อจอแคบ
const DOCS = {
  'บุคคลทั่วไป': ['สำเนาบัตรประชาชน', 'สำเนาทะเบียนบ้าน', 'สำเนาโฉนดที่ดิน', 'สำเนาสมุดบัญชี|ธนาคาร', 'หนังสือ|ให้ความยินยอม', 'หนังสือเรื่อง|ผู้รับจำนอง'],
  'บริษัท': ['บัตร|ผู้มีอำนาจลงนาม', 'ทะเบียนบ้าน|ผู้มีอำนาจลงนาม', 'ทะเบียน|ที่ตั้งอาคาร', 'สำเนาบัญชี|ธนาคาร', 'หนังสือรับรอง|บริษัท', 'ภ.พ. 20'],
  'หน่วยราชการ': ['บัตร|ผู้มีอำนาจลงนาม', 'ทะเบียนบ้าน|ผู้มีอำนาจลงนาม', 'ทะเบียนที่ตั้ง|สถานที่ราชการ', 'สำเนาบัญชี|ธนาคาร', 'หนังสือแต่งตั้ง', 'ใบเสร็จรับเงิน'],
};
const wrapName = s => s.split('|').map(c => `<span class="nb">${c}</span>`).join('<wbr>');
// คำประสมที่เบราว์เซอร์ตัดกลางคำได้ (เครื่อง/มือ , หน่วย/งาน , บาทต่อ/ปี , งวด/แรก , ราย/เดือน) ห่อเป็นก้อนห้ามตัดทุกที่ที่ขึ้นจอ
// ผู้หักล้าง รุ่น 4 เจอหลายจุดที่ 320 ถึง 390 แก้ทีละจุดไม่ครบ จึงห่อหลังวาดทุกครั้ง
// รุ่น 7 ฟ้าเห็น ผู้/ร่าง ตกบรรทัดในภาพมือถือ วัดทุกจอที่ความกว้าง 320 ถึง 1024 แล้วเติมคำที่ถูกตัดจริงและอ่านแล้วความหมายเพี้ยน
// หรือเหลือคำค้างท้ายบรรทัด (ผู้ให้/เช่า , ค่า/เช่า , ใบ/เสร็จ , แม่/แบบ , ส่วน/บุคคล ...) 01/10/2026
// รุ่น 8 วัดซ้ำหลังเพิ่มข้อความใหม่ เจอ ด่าน/แรก , ครั้ง/เดียว , ขั้นที่/เหลือ , ทำ/ต่อใน SAR (อ่านเป็นต่อสัญญาได้) , งาน/นี้
// รุ่น 9 วัดซ้ำทุกจอทุกความกว้างหลังเพิ่มข้อความจากผังของคนทำระบบ เจอ ก/ล่อง (ตัดกลางคำ) , คน/ทำระบบ , ขั้น/ตอน , อัป/โหลด ,
// ค่าใช้/จ่าย , ผู้รับ/เงิน , ราย/ละเอียด , พื้นที่/เช่า , บุคคล/ทั่วไป , เลข/สัญญา , หน้า/สรุป , ส่วน/หนึ่ง , ตั้ง/ค่า (02/10)
// และเห็นจากภาพว่า เดิม กับ เดียว ตกไปอยู่บรรทัดเดียวโดด ๆ (ตาม/เดิม , อย่าง/เดียว) จึงเติมอีก 7 คำ
// แล้วไล่คำศัพท์ของงานนี้ในผลวัด เจอ ตี/กลับ (อ่านเป็นตี) , คำ/ตอบ , ชื่อกรณี รวม/สัญญา แยก/สัญญา กับชื่อขั้น ร่าง/สัญญา เติมอีก 5 คำ
// รุ่น 10 วัดซ้ำหลังเพิ่มหนังสือตามแบบฟอร์มจริงกับเรื่องขยายระยะเวลา รวมสภาพที่ต้องกดก่อน (ใบแนบที่พับ ฟอร์มขยาย รายการทั้งหมด) เจอคำถูกตัดกลางคำ
// แบบ/ฟอร์ม , ลง/นาม , รื้อ/ถอน , ขาย/ฝาก , แบ่ง/แยก กับคำที่ตัดแล้วอ่านเพี้ยน นับ/แต่ (อ่านเป็นแต่) , สี/ฟ้า , สัญญา/เช่า ,
// ทาง/ไปรษณีย์ , บัญชี/ธนาคาร , หนังสือ/ยินยอม , ตอบ/กลับ , ติด/ภาระ , ชุด/เดียว ... เติมอีก 23 คำ (02/10)
const KEEP = /เครื่องมือ|คนทำระบบ|ขั้นตอน|อัปโหลด|พื้นที่เช่า|ค่าใช้จ่าย|ผู้รับเงิน|รายละเอียด|กล่อง|บุคคลทั่วไป|เลขสัญญา|หน้าสรุป|ส่วนหนึ่ง|ตั้งค่า|หน่วยงาน|บาทต่อปี|งวดแรก|รายเดือน|รายปี|ผู้ให้เช่า|ผู้เช่า|ผู้ร่าง|ผู้เซ็น|ผู้บริหาร|ผู้ตัดสิน|ค่าเช่า|ค่าเริ่มต้น|ใบเสร็จ|ใบตอบรับ|เจ้าของงาน|ข้อเสนอ|ครบกำหนด|คู่สัญญา|ระยะเวลา|ส่วนบุคคล|หน้างาน|แม่แบบ|ต่ออายุ|หน้าจอ|มือถือ|ตีกลับ|คำตอบ|รวมสัญญา|แยกสัญญา|ร่างสัญญา|ตามเดิม|อย่างเดียว|ด่านแรก|ครั้งเดียว|ที่เหลือ|ทำต่อ|งานนี้|แบบฟอร์ม|ผู้ลงนาม|ลงนาม|รื้อถอน|ขายฝาก|แบ่งแยก|นับแต่|สีฟ้า|สัญญาเช่า|ทะเบียนบ้าน|บัตรประชาชน|บัญชีธนาคาร|หนังสือยินยอม|หนังสือรับรอง|ตอบกลับ|ติดภาระ|ทางไปรษณีย์|ทางอีเมล|เอกสารประกอบ|ช่วงขยาย|ชุดเดียวกัน|ชุดเดียว|ผู้รับจำนอง/g;
function keepWords(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), hits = [];
  for (let n = w.nextNode(); n; n = w.nextNode()) {
    if (n.data.search(KEEP) >= 0 && !n.parentElement.closest('.nb, option, textarea')) hits.push(n);

function summary(t, k) {
  const a = A(t), p = P(t), same = a.term === p.term && a.rent === p.rent && a.pay === p.pay;
  // รุ่น 10: สรุปบอกทางส่ง ไปรษณีย์บอกเลขพัสดุ อีเมลบอกอีเมลผู้ให้เช่า
  if (k === 'letter') return (t.own ? 'ส่งหนังสือตามแบบของหน่วยงานแล้ว ' : 'ส่งแล้ว ') + fd(t.sent || TODAY) + ' ' + viaText(t.via || 'ไปรษณีย์')
    + (t.via === 'อีเมล' ? (t.lmail ? ` <span class="nb">${esc(t.lmail)}</span>` : '') : (t.track ? ` เลขพัสดุ <span class="nb">${esc(t.track)}</span>` : ''));
  if (k === 'response') return t.answer ? t.answer + (t.rvia ? ' ตอบ' + viaText(t.rvia) : '') : '';
  if (k === 'nego') return (same ? 'ตกลงตามที่เสนอ ' : 'ตกลง ') + `${a.term} ปี ${baht(a.rent)}${a.pay === 'รายปี' ? '' : ' ชำระ' + a.pay}`;
  if (k === 'docs') {
    const all = DOCS[t.type].length, got = DOCS[t.type].filter((_, i) => t.att['d' + i]).length;
    return got === all ? 'แนบครบ ' + all + ' รายการ' : 'แนบแล้ว ' + got + ' จาก ' + all + ' รายการ';
  }
  if (k === 'pre') return t.cpa === 'done' ? 'CPA กรอกและส่งตรวจแล้ว' : 'ส่งตรวจแล้ว';
  if (k === 'review') return 'อนุมัติแล้ว สัญญาเป็น <span class="nb">Pre-active</span>';
  if (k === 'contract') return t.own ? 'แนบสัญญาที่หน่วยงานออกแล้ว' : t.nonstd ? 'แนบสัญญาไม่มาตรฐานแล้ว' : 'ออกสัญญาแล้ว';
  if (k === 'sign') return ['เซ็นบนจอ', 'เซ็นทางลิงก์', 'เซ็นกระดาษ'][paperOnly(t) ? 2 : +(t.mode || 0)] + ' ส่งเข้าตรวจแล้ว';
  if (k === 'check') return 'ตรวจผ่าน งานเสร็จ';
  return '';
}

  const form = (key, lab, hold, go) => `
      <div class="stack" id="${key}-form" hidden>
        <label><span class="lab">${lab}</span><textarea class="field" id="${key}-text" data-keep placeholder="${hold}">${esc(dv(t, key + '-text', ''))}</textarea></label>
        <button class="ghost" data-act="${key}-go"${dv(t, key + '-text', '').trim() ? '' : ' disabled'}>${go}</button>
      </div>`;
  return `
    <div class="exc" id="exc">
      <span class="lab">เซ็นต่อไม่ได้</span>
      <div class="acts"><button class="ghost" data-act="open" data-form="ask">ผู้ให้เช่าขอแก้เงื่อนไข</button><button class="ghost" data-act="open" data-form="party">คู่สัญญาเปลี่ยน</button></div>
      ${form('ask', 'ผู้ให้เช่าขอแก้อะไร', 'เช่น ขอเปลี่ยนการชำระเป็นรายเดือน', 'ยกเลิกรอบเซ็น ส่งกลับไปอนุมัติ')}
      ${form('party', 'เกิดอะไรขึ้น', 'เช่น ขายที่ดินแล้ว หรือผู้ให้เช่าเสียชีวิต', 'หยุดการเซ็น แจ้ง CDC ตัดสิน')}
    </div>`;
}

const F = {
  letter: t => {

    ${attach(t, 'gov', 'หนังสือตามแบบ|ของหน่วยงาน', 'แนบไฟล์')}
    ${send}${MISS}
    <button class="btn" data-go="letter">ยืนยันว่าส่งหนังสือแล้ว</button>`;
    // รุ่น 10 ตามแบบฟอร์มหนังสือที่ใช้จริง (02/10/2026): หนังสือ ใบตอบรับ แบบฟอร์มแจ้งรายละเอียด ออกจากค่าชุดเดียว
    // ตัวอย่างจริงที่ได้มา ใบตอบรับเขียน 1 ปีทั้งที่ช่วงวันที่ 3 ปี ช่องที่เติมให้ทุกแผ่นจึงใช้ data-m ชุดเดียว แก้ข้อเสนอแล้วเปลี่ยนพร้อมกัน
    const [s, e] = period(t, parseInt(pt, 10) || p.term), rent = numOf(pr);
    const m = (k, v, w) => `<mark data-m="${k}"${w ? ' class="w"' : ''}>${v}</mark>`;

    <div>

        <p>โปรดส่งใบตอบรับกับแบบฟอร์มแจ้งรายละเอียด พร้อมเอกสารประกอบที่ลงนามรับรองสำเนาแล้ว กลับภายใน 7 วันนับแต่วันที่ได้รับหนังสือ</p>

      <div class="sheet" id="sheet-reply">
        <p class="c">ใบตอบรับการต่ออายุสัญญาเช่า</p>
        <p>ผู้ให้เช่าติ๊กยอมรับเงื่อนไข</p>
        <ul><li>☐ ${terms}</li><li>☐ ${money}</li><li>☐ การชำระ ${m('pay', pp)}</li></ul>
        <p>รายการเอกสารที่ผู้ให้เช่าติ๊กว่าแนบกลับ 8 รายการ: บัตรประชาชนกับทะเบียนบ้าน , หนังสือรับรองบริษัท , เอกสารสิทธิ์ในอาคาร , เอกสารสิทธิ์ในที่ดิน , สมุดบัญชีธนาคาร , หนังสือยินยอมจากเจ้าของกรรมสิทธิ์ , หนังสือยินยอมจากผู้รับจำนอง , อื่น ๆ</p>
        <p>ผู้ให้เช่าลงชื่อ วันที่ และเบอร์โทร</p>
      </div>
      <div class="sheet" id="sheet-form">
        <p class="c">แบบฟอร์มแจ้งรายละเอียด</p>
        <p>รหัสไซต์ <mark>${t.site}</mark> ผู้ให้เช่า <mark>${t.ll}</mark></p>
        <p>ผู้ให้เช่ากรอกที่อยู่สำหรับติดต่อและส่งเอกสาร เบอร์โทรศัพท์ อีเมล และเรื่องที่อยากแจ้งเพิ่ม</p>
        <p>ท้ายแผ่นมีป้ายจ่าหน้าซองส่งกลับบริษัท</p>
      </div>
    </details>
    ${send}
    ${extra(t, 'letterfile', 'ดาวน์โหลดหนังสือ', 'ดาวน์โหลดแล้ว')}
    <button class="btn" data-go="letter">ยืนยันว่าส่งหนังสือแล้ว</button>`;
  },

  response: t => {
    const sent = t.sent || TODAY, due = plusDays(sent, 7), late = Math.round((TODAY - due) / 864e5), up = t.rung > 1;
    // คำตอบที่เลือกค้างไว้แต่ยังไม่บันทึกอยู่ใน dr กดส่งต่อ CDC หรือออกจากงานแล้วกลับมา ตัวเลือกยังอยู่
    const ans = t.answer || dv(t, 'ans', '');
    // หน่วยราชการใช้หนังสือตามแบบของหน่วยงาน ไม่มีใบตอบรับกับกำหนด 7 วันของหนังสือมาตรฐาน
    const due7 = t.own ? `<p class="hint" id="due">ส่งหนังสือตามแบบของหน่วยงาน ${fd(sent)} บันทึกคำตอบที่หน่วยงานแจ้งกลับ</p>`
      : `<p class="hint" id="due">ส่งหนังสือ ${fd(sent)} ${viaText(t.via || 'ไปรษณีย์')} ครบกำหนดตอบ ${fd(due)}${late > 0 && !t.answer ? `<span class="tag bad">เลยกำหนด ${late} วัน</span>` : ''}</p>`;
    // รุ่น 10: ผู้ให้เช่าตอบกลับทางไหน ตั้งต้นตามทางที่ส่ง (คำเล่าของเจ้าของงาน ส่งไปรษณีย์ส่งกลับไปรษณีย์ ส่งอีเมลตอบอีเมล)
    const rvia = dv(t, 'r-via', t.rvia || t.via || 'ไปรษณีย์');
    const back = `
    <fieldset class="tiles">
      <legend class="lab">ผู้ให้เช่าตอบกลับทาง</legend>
      ${RVIAS.map(v => `<label class="tile radio"><input type="radio" name="r-via" value="${v}"${v === rvia ? ' checked' : ''}><span>${v}</span></label>`).join('')}
    </fieldset>`;
    // เลยกำหนดแล้วยังไม่ตอบ: จดการติดตาม กับออกหนังสือซ้ำจากข้อมูลเดิม (ร่าง 4.4 กับ 2-07) ประวัติการติดตามคงไว้หลังออกหนังสือซ้ำ
    const chase = !t.own && late > 0 && !t.answer;
    const follow = chase || t.follows.length ? `
    <div class="stack" id="follow">
      ${t.follows.length ? `<div><span class="lab">การติดตามที่ผ่านมา</span><ul class="log" id="follows">${t.follows.map(x => `<li>${x.date}: ${esc(x.note)}</li>`).join('')}</ul></div>` : ''}
      ${chase ? `<label><span class="lab">บันทึกการติดตามรอบนี้</span><input class="field" id="f-note" data-keep placeholder="โทร ไลน์ หรือไปหา ได้คำตอบว่าอะไร" value="${esc(dv(t, 'f-note', ''))}"></label>
      <div class="acts"><button class="ghost" data-act="follow">บันทึกการติดตาม</button><button class="ghost" data-act="resend">ออกหนังสือซ้ำจากข้อมูลเดิม</button></div>` : ''}
    </div>` : '';
    return `
    ${due7}${follow}
    <fieldset class="tiles">
      <legend class="lab">ผู้ให้เช่าตอบว่า</legend>
      ${['ต่อสัญญา', 'ไม่ต่อ'].map(a => `<label class="tile radio"><input type="radio" name="ans" value="${a}"${a === ans ? ' checked' : ''}><span>${a}</span></label>`).join('')}
    </fieldset>
    ${back}
    <div class="two">
      <label><span class="lab">วันที่ตอบ</span><input class="field" id="r-date" data-keep value="${esc(dv(t, 'r-date', fmt(TODAY)))}"></label>
      <label><span class="lab">หมายเหตุ</span><input class="field" id="r-note" data-keep placeholder="ถ้ามี" value="${esc(dv(t, 'r-note', ''))}"></label>
    </div>
    <div class="stack" id="no-renew"${ans === 'ไม่ต่อ' ? '' : ' hidden'}>
      <div>
        <span class="lab">ผู้ให้เช่าไม่ต่อ เจรจาตามลำดับไม้ 1 ถึง 3</span>
        <ul class="track" id="ladder">
          <li class="${up ? 'ok' : 'now'}"><span>ไม้ 1 คนหน้างานเจรจาเอง</span></li>
          <li class="${up ? 'now' : ''}"><span>ไม้ 2 และ 3 CDC หรือผู้บริหารช่วยคุย</span></li>
        </ul>
      </div>
      ${t.talks.length ? `<div><span class="lab">บันทึกที่ผ่านมา</span><ul class="log" id="talks">${t.talks.map((x, i) => `<li>รอบ ${i + 1} วันที่ ${x.date}: ${esc(x.note)}</li>`).join('')}</ul></div>` : ''}
      <label><span class="lab">บันทึกการเจรจารอบนี้</span><textarea class="field" id="talk" data-keep placeholder="คุยกับใคร เสนออะไร ได้คำตอบว่าอะไร">${esc(dv(t, 'talk', ''))}</textarea></label>
      <button class="ghost${up ? ' is-set' : ''}" data-act="cdc"${up ? ' disabled' : ''}>${up ? 'ส่งต่อไม้ 2 แล้ว' : 'ส่งต่อไม้ 2 ให้ CDC ช่วยคุย'}</button>
      <p class="hint">ถ้าผู้ให้เช่าเปลี่ยนใจ เลือกคำตอบใหม่แล้วบันทึก</p>
      ${cancelExc(t, 'ถ้าผู้ให้เช่ายืนยันไม่ต่อ')}
    </div>
    ${t.own ? '' : extra(t, 'reply', 'ถ่ายภาพใบตอบรับ', 'แนบใบตอบรับแล้ว')}
    ${MISS}
    <button class="btn" data-go="response">บันทึกคำตอบ</button>`;
  },

  docs: t => `

    <ul class="docs">${DOCS[t.type].map((d, i) => `<li class="doc"><span>${wrapName(d)}</span><button class="ghost${t.att['d' + i] ? ' is-set' : ''}" data-doc="d${i}" data-need="เอกสาร">${t.att['d' + i] ? 'แนบแล้ว' : 'ถ่ายรูป'}</button></li>`).join('')}</ul></div>

  pre: t => {
    const a = A(t), dT = draftTerm(t), [st, en] = period(t, dT), pre = t.pre || ['', '', '', ''];
    const left = pre.filter(v => !v).length, off = dT !== a.term, lack = DOCS[t.type].filter((_, i) => !t.att['d' + i]).length;
    // ส่งต่อ CPA แล้ว = งานอยู่ที่ CPA ขั้นนี้เป็นกรอบเทาแบบขั้นที่รอคนอื่น คนคีย์เป็นคนกดส่ง CPA จึงส่งตรวจเอง
    if (t.cpa === 'sent') return `
    ${WAITLEAD('งานอยู่ที่ CPA รอกรอก ' + left + ' ช่องที่เหลือบนจอคอม แล้ว CPA กดส่งตรวจเอง')}
    <button class="ghost" data-act="cpa-back">ดึงงานกลับมากรอกเอง</button>
    ${DEMO('data-act="cpa-done"', 'จำลองว่า CPA กรอกและส่งตรวจแล้ว')}`;
    const sel = (i, lab, list) => `<label><span class="lab">${lab}</span><select class="field${pre[i] ? '' : ' is-empty'}" data-pre="${i}"><option value="">เลือก</option>${opts(list, pre[i])}</select></label>`;
    // ผลตรวจ 3 ระดับ แดง = ต้องแก้ก่อนส่ง , เหลือง = ส่งได้แต่ควรดู , เขียว = ผ่าน
    const item = (cls, text) => `<li class="${cls}"><span>${text}</span></li>`;
    // ค่าไม่ตรงที่ตกลงเป็นแค่ข้อเตือน ยกเว้นงานที่ CDC ตีกลับเพราะจุดนั้น ต้องแก้ก่อนส่งอีกครั้ง
    const offCls = !off ? 'ok' : t.back ? 'bad' : 'warn';
    const missing = DOCS[t.type].map((d, i) => t.att['d' + i] ? '' : `<li class="doc"><span>${wrapName(d)}</span><button class="ghost" data-doc="d${i}">ถ่ายรูป</button></li>`).join('');
    // ช่องที่เครื่องเติมให้เป็นพื้นเทา ช่องระยะเวลาเลือกใหม่ได้ แต่เป็นพื้นเทาจนกว่าค่าจะไม่ตรงที่ตกลง
    return `
    ${t.back ? `<p class="alert">ถูกตีกลับจาก ${t.backFrom ? t.backFrom + ' ผ่าน CDC' : 'CDC'}: ${t.back}</p>` : ''}
    <p class="hint">ในตัวอย่างนี้ เติมให้แล้ว 7 ช่อง ${left ? 'เหลือกรอก ' + left + ' ช่อง' : 'กรอกครบแล้ว'}</p>
    ${t.ext ? '<p class="note" id="ext">งาน Extend ไม่ผ่านขั้นต่อรอง ระยะเวลา ค่าเช่า และการชำระตั้งต้นจากสัญญาเดิม</p>' : ''}
    <div class="two">
      <label><span class="lab">วันเริ่มสัญญา</span><input class="field" id="f-start" readonly value="${fmt(st)}"></label>
      <label><span class="lab">วันสิ้นสุดสัญญา</span><input class="field" id="f-end" readonly value="${fmt(en)}"></label>
      <label><span class="lab">ระยะเวลา</span><select class="field${off ? ' is-' + offCls : ' is-auto'}" id="d-term">${opts(TERMS, dT + ' ปี')}</select>${off ? `<span class="hint ${offCls}">${t.back ? (t.backFrom || 'CDC') + ' ชี้จุดนี้ ' : ''}${t.ext ? 'สัญญาเดิม' : 'ที่ตกลงคือ'} ${a.term} ปี</span>` : ''}</label>
      <label><span class="lab">ค่าเช่า</span><input class="field" id="f-rent" readonly value="${baht(a.rent)}"></label>
      <label><span class="lab">การชำระ</span><input class="field" id="f-pay" readonly value="${a.pay}"></label>
      <label><span class="lab">ประเภทผู้ให้เช่า</span><input class="field" readonly value="${t.type}"></label>
      <label><span class="lab">สัญญาออกโดย</span><input class="field" readonly value="${t.own ? 'ผู้ให้เช่า' : 'บริษัท'}"></label>
    </div>
    <div class="two">
      ${sel(0, 'ภาษีหัก ณ ที่จ่าย', ['บริษัทเป็นผู้ออก', 'ผู้ให้เช่าเป็นผู้ออก'])}
      ${sel(1, 'ภาษีโรงเรือน', ['ผู้ให้เช่า', 'บริษัท'])}
      ${sel(2, 'รับเช็คงวดแรก', ['ไม่รับ', 'รับ'])}
      ${sel(3, 'การคิดค่าไฟ', ['มิเตอร์การไฟฟ้า', 'เหมาจ่าย'])}
    </div>
    <p class="note" id="groups">ฟอร์ม Pre-Contract ใน SAR มี 6 กลุ่ม ขั้นนี้วาดแค่กลุ่มรายละเอียดร่างสัญญา กลุ่มบุคคลที่เกี่ยวข้อง&nbsp;, พื้นที่เช่า&nbsp;, การเข้าพื้นที่&nbsp;, รายการค่าใช้จ่ายกับผู้รับเงิน ตัวอย่างถือว่าใช้ของสัญญาเดิม ส่วนเอกสารที่เกี่ยวข้องคือขั้น 04</p>
    <div>
      <span class="lab">ตรวจก่อนส่ง</span>
      <ul class="track" id="precheck">
        ${item(left ? 'bad' : 'ok', left ? 'ช่องบังคับ เหลือ ' + left + ' ช่อง' : 'ช่องบังคับครบ')}
        ${item(offCls, !off ? (t.ext ? 'ตรงกับสัญญาเดิม' : 'ตรงกับเงื่อนไขที่ตกลง') : (t.ext ? 'ระยะเวลาไม่ตรงกับสัญญาเดิม' : 'ระยะเวลาไม่ตรงกับที่ตกลง') + (t.back ? ' ต้องแก้ก่อนส่งอีกครั้ง' : ' ส่งได้ แต่ CDC อาจตีกลับ'))}
        ${item(lack ? 'warn' : 'ok', lack ? 'เอกสารประกอบยังขาด ' + lack + ' รายการ ส่งได้ แล้วแนบตามทีหลัง' : 'เอกสารประกอบครบ')}
      </ul>
    </div>
    ${lack ? `<div id="lack"><span class="lab">เอกสารที่ยังขาด แนบตรงนี้ได้</span><ul class="docs">${missing}</ul></div>` : ''}
    ${left ? `<div class="stack"><button class="ghost" data-act="cpa">ส่งต่อให้ CPA กรอกต่อ</button><p class="hint">ทางนี้ใช้กับงานของ NG_TRUE ตามค่าเริ่มต้น งานของ Vendor คีย์เอง</p></div>` : ''}
    ${t.cpa === 'back' ? '<p class="note">ดึงงานกลับจาก CPA แล้ว กรอกช่องที่เหลือเองได้</p>' : ''}
    <button class="btn" data-go="pre"${left || (off && t.back) ? ' disabled' : ''}>${t.back ? 'ส่งตรวจอีกครั้ง' : 'ส่งตรวจ'}</button>`;
  },

  review: t => gateBody(t, 'review'),

  contract: t => {
    const a = A(t);
    const kv = `<dl class="kv"><div><dt>ระยะเวลา</dt><dd>${a.term} ปี</dd></div><div><dt>ค่าเช่า</dt><dd>${baht(a.rent)}</dd></div><div><dt>การชำระ</dt><dd>${a.pay}</dd></div><div><dt>สายของงาน</dt><dd>${t.cheque ? 'สายเช็คงวดแรก' : 'สายปกติ'}</dd></div></dl>`;
    const pa = '<p class="hint">สัญญาเป็น Pre-active แล้ว จึงเข้าขั้นเซ็นได้</p>';
    if (t.own) return `${pa}${kv}
    <p class="note">ผู้ให้เช่าออกสัญญาเอง เครื่องมือไม่ออกสัญญาจากแม่แบบ แนบไฟล์สัญญาที่หน่วยงานออก แล้วให้คนตรวจตามเดิม</p>
    ${attach(t, 'contract', 'สัญญาที่|หน่วยงานออก', 'แนบไฟล์')}${MISS}
    <button class="btn" data-go="contract">ไปขั้นเซ็น</button>`;
    // สัญญาไม่มาตรฐาน: ไม่ออกจากแม่แบบ แนบไฟล์สัญญาที่ผ่านการตรวจแล้ว (ร่าง 4.4 กับ 3-04)
    if (t.nonstd) return `${pa}${kv}
    <p class="note">สัญญาไม่มาตรฐาน เครื่องมือไม่ออกสัญญาจากแม่แบบ แนบไฟล์สัญญาที่ผ่านการตรวจแล้ว แล้วให้คนตรวจตามเดิม</p>
    ${attach(t, 'contract', 'สัญญาที่ผ่าน|การตรวจแล้ว', 'แนบไฟล์')}${MISS}
    <button class="btn" data-go="contract">ไปขั้นเซ็น</button>`;
    return `${pa}${kv}
    <div>
      <p class="paper-cap">ตัวอย่างสัญญา หน้าแรก ช่องสีฟ้าคือข้อมูลที่เติมให้</p>
      ${paperOf(t)}
    </div>
    ${extra(t, 'contractfile', 'ดาวน์โหลดสัญญา', 'ดาวน์โหลดแล้ว')}
    <button class="btn" data-go="contract">ไปขั้นเซ็น</button>`;
  },

  sign: t => {
    // คู่สัญญาเปลี่ยน (ขายที่ดิน ผู้ให้เช่าเสียชีวิต) หยุดการเซ็นแล้วรอ CDC ตัดสิน เครื่องมือไม่เปลี่ยนคู่สัญญาเอง (ร่าง 4.4 กับส่วนหยุดแล้วแจ้งของ 3-05)
    if (t.stop) return `
    ${WAITLEAD('หยุดการเซ็นแล้ว รอ CDC ตัดสินเรื่องคู่สัญญา')}
    <p class="note" id="stop">คู่สัญญาเปลี่ยน แจ้งเมื่อ ${t.stop.date}: ${esc(t.stop.note)}</p>
    <dl class="kv"><div><dt>ผู้ให้เช่าในสัญญาเดิม</dt><dd>${t.ll}</dd></div></dl>
    <p class="hint">เครื่องมือไม่เปลี่ยนคู่สัญญาเอง CDC ตัดสินแล้วจึงทำต่อตามที่ CDC บอก</p>`;
    const a = A(t), mode = paperOnly(t) ? '2' : (t.mode || '0');
    // ส่งลิงก์แล้วยังไม่เซ็น = งานอยู่ที่ผู้ให้เช่า ขั้นนี้เป็นกรอบเทา ไม่มีปุ่มหลักจนกว่าผู้ให้เช่าเซ็น
    // งานสายเช็คที่ยังไม่แนบใบเสร็จยังเป็นกรอบปกติ เพราะยังมีของให้คนหน้างานทำ
    const wait = viewing(t), sent = mode === '1' && t.link === 'sent';
    const link = t.link ? `<ul class="track"><li class="ok"><span>ส่งลิงก์แล้ว ถึง ${esc(t.mail || '')}</span></li><li class="${t.link === 'signed' ? 'ok' : 'now'}"><span>${t.link === 'signed' ? 'ผู้ให้เช่าเซ็นแล้ว' : 'รอผู้ให้เช่าเปิดลิงก์และเซ็น'}</span></li></ul>` : '';
    return `
    ${wait ? WAITLEAD('งานอยู่ที่ผู้ให้เช่า รอเปิดลิงก์และเซ็น') : ''}
    <dl class="kv"><div><dt>ผู้เซ็น</dt><dd>${t.ll}</dd></div><div><dt>ระยะเวลา</dt><dd>${a.term} ปี</dd></div><div><dt>ค่าเช่า</dt><dd>${baht(a.rent)}</dd></div><div><dt>การชำระ</dt><dd>${a.pay}</dd></div></dl>
    ${t.own ? '<p class="note">ผู้ให้เช่าออกสัญญาเอง เซ็นบนกระดาษนอกเครื่องมือ แล้วถ่ายภาพแนบ</p>' : t.signers > 1 ? `<p class="note">ผู้ให้เช่า ${t.signers} คนในสัญญาเดียว เฟสแรกเซ็นบนกระดาษนอกเครื่องมือให้ครบทุกคน แล้วถ่ายภาพแนบ</p>` : `<div class="stack"><button class="ghost" data-act="read">${t.readOpen ? 'ปิดสัญญา' : 'เปิดสัญญาให้ผู้ให้เช่าอ่าน'}</button>
    <div id="read-paper"${t.readOpen ? '' : ' hidden'}>${paperOf(t)}</div></div>
    <fieldset class="tiles">
      <legend class="lab">วิธีเซ็น</legend>
      ${['เซ็นบนจอ', 'ส่งลิงก์อีเมล', 'เซ็นกระดาษ'].map((m, i) => `<label class="tile radio"><input type="radio" name="mode" value="${i}"${String(i) === mode ? ' checked' : ''}><span>${m}</span></label>`).join('')}
    </fieldset>`}
    <label class="tile check" id="id-wrap"${mode === '1' ? ' hidden' : ''}><input type="checkbox" id="id-ok"${t.idOk ? ' checked' : ''}><span>${t.signers > 1 ? 'ตรวจบัตรผู้เซ็นครบ ' + t.signers + ' คนแล้ว' : 'ตรวจบัตรผู้เซ็นแล้ว'}</span></label>
    ${t.own ? '<p class="hint">หน่วยงานเซ็นโดยผู้มีอำนาจลงนาม วิธียืนยันตัวผู้ลงนามรอฝ่ายกฎหมาย</p>' : ''}
    <div id="mode-0"${mode === '0' ? '' : ' hidden'}>
      <span class="lab">ลายมือชื่อผู้ให้เช่า</span>
      <div class="pad-wrap"><canvas class="pad" id="pad" aria-label="ช่องลงลายมือชื่อ"></canvas><span class="pad-tip" id="pad-tip">เซ็นตรงนี้</span></div>
      <button class="link" id="pad-clear">ล้างลายมือชื่อ</button>
    </div>
    <div class="stack" id="mode-1"${mode === '1' ? '' : ' hidden'}>
      <label><span class="lab">อีเมลผู้ให้เช่า</span><input class="field" type="email" id="ll-mail" placeholder="name@example.com" value="${esc(t.mail || '')}"${t.link ? ' readonly' : ''}></label>
      ${link}
      ${t.link === 'sent' ? '<button class="ghost" data-act="link-cancel">ยกเลิกลิงก์แล้วแก้อีเมล</button>' : ''}
    </div>
    <div id="mode-2"${mode === '2' ? '' : ' hidden'}>${attach(t, 'signed', 'ภาพสัญญาที่เซ็นแล้ว')}</div>
    ${t.cheque ? `${attach(t, 'receipt', 'ใบเสร็จค่าเช่างวดแรก')}` : ''}
    ${MISS}
    <button class="btn" data-go="sign" id="send-sign"${wait ? ' hidden' : ''} disabled>ส่งเข้าตรวจ</button>
    ${sent ? DEMO('data-act="link-signed"', 'จำลองว่าผู้ให้เช่าเซ็นแล้ว') : ''}
    ${wait || sent ? '' : signExc(t)}`;
  },

  check: t => gateBody(t, 'check'),
};

// ตัวอย่างสัญญาหน้าแรก ใช้ทั้งขั้นออกสัญญาและตอนเปิดให้ผู้ให้เช่าอ่านก่อนเซ็น
function paperOf(t) {
  const a = A(t), [st, en] = period(t, a.term);
  // สัญญาไม่มาตรฐานไม่มีหน้าจากแม่แบบ เปิดไฟล์ที่แนบไว้ในขั้น 06 ให้อ่านแทน
  if (t.nonstd) return `<div class="paper">
        <p>สัญญาไม่มาตรฐาน ไฟล์ที่แนบในขั้น 06 (ไฟล์สมมติ)</p>
        <p>ระหว่าง <mark>${t.ll}</mark> ผู้ให้เช่า กับ บริษัทผู้เช่า พื้นที่เช่าของไซต์ <mark>${t.site}</mark></p>
      </div>`;
  return `<div class="paper">
        <p>สัญญาเช่าพื้นที่ (ฉบับตัวอย่าง)</p>
        <p>ระหว่าง <mark>${t.ll}</mark> ผู้ให้เช่า กับ บริษัทผู้เช่า</p>
        <p>พื้นที่เช่าของไซต์ <mark>${t.site}</mark> ระยะเวลา <mark>${a.term} ปี</mark> ตั้งแต่ <mark>${fmt(st)}</mark> ถึง <mark>${fmt(en)}</mark> ค่าเช่า <mark>${baht(a.rent)}</mark> ชำระ<mark>${a.pay}</mark></p>
      </div>`;
}

function viewTask(id) {
  const t = find(id);
  if (!t) { location.hash = '#/tasks'; return; }
  setBar(t.site);
  const now = idx(t.at);
  const card = k => {
    // ขั้นตรวจ: ยังไม่ถึง = ตรวจ , กำลังรอ = รอ , ผ่านแล้ว = ผ่าน
    const i = idx(k), s = STEP[k], gate = !s.no, no = gate ? (i < now ? 'ผ่าน' : i === now ? 'รอ' : 'ตรวจ') : s.no;
    if (i < now) return `<li class="step is-done"><div class="step-head"><span class="no">${no}</span><span class="step-name">${s.name}</span><span class="step-note">${summary(t, k)}</span></div></li>`;
    if (i > now) return `<li class="step is-next"><div class="step-head"><span class="no">${no}</span><span class="step-name">${s.name}</span></div></li>`;
    return `<li class="step is-now${gate || viewing(t) ? ' is-view' : ''}" id="now"><div class="step-head"><span class="no">${no}</span><h2 class="step-name">${s.name}</h2></div><div class="body">${inSar(t) ? SAR_ONLY : t.cancel ? cancelBody(t) : F[k](t)}</div></li>`;
  };
  // งาน Extend ไม่มีขั้น 01 ถึง 03 งานที่ส่งขอยกเลิกแล้วแสดงขั้นในกล่อง 2 ถึงขั้นที่ขอยกเลิก ที่เหลือเป็นแถวเดียว (รุ่น 9)
  const box2 = t.ext ? ['docs', 'pre'] : ['letter', 'response', 'nego', 'docs', 'pre'];
  const shown = t.cancel ? box2.slice(0, box2.indexOf(t.at) + 1) : box2;
  app.innerHTML = `
    <h1>${t.site}</h1>
    <p class="sub">${t.ll}</p>
    <section class="old" aria-label="สัญญาเดิม">
      <dl class="kv">
        <div><dt>สัญญาเดิมหมด</dt><dd>${fmt(t.end)}</dd></div>
        <div><dt>ค่าเช่าเดิม</dt><dd>${baht(t.rent)}</dd></div>
        <div><dt>ประเภทผู้ให้เช่า</dt><dd>${t.type}</dd></div>
        <div><dt>สถานะ</dt><dd id="state">${stateTag(t)}</dd></div>
      </dl>
      ${cases(t).length ? `<div class="old-case"><p class="lab">กรณีพิเศษ</p><p class="cases" id="cases">${caseTags(t)}</p></div>` : ''}
    </section>
    <p class="group">กล่อง 2 เตรียมสัญญา ขั้น 01 ถึง 05</p>
    <ol class="steps">${now > idx('review')
      ? `<li class="step is-done is-sum"><div class="step-head"><span class="step-name">${t.ext ? 'ขั้น 04 ถึง 05' : 'ขั้น 01 ถึง 05'}</span><span class="step-note">เสร็จครบ</span></div></li>`
      : (t.ext ? SKIP : '') + shown.map(card).join('')}</ol>
    ${inSar(t) ? REST : t.cancel ? STOPPED(t) : `<p class="group">ด่านตรวจเดิมใน SAR กับ SMT ไม่อยู่ในกล่อง</p>
    <ol class="steps">${card('review')}</ol>
    <p class="group">กล่อง 3 เซ็นสัญญา ขั้น 06 ถึง 07</p>
    <ol class="steps">${['contract', 'sign'].map(card).join('')}</ol>
    <p class="group">ด่านตรวจเดิมใน SAR กับ SMT ไม่อยู่ในกล่อง</p>
    <ol class="steps">${card('check')}</ol>`}
    ${inSar(t) || t.cancel ? '' : srcLine((t.own && SRC_OWN[t.at]) || SRC[t.at])}${caseSrc(t).map(srcLine).join('')}`;
  keepWords(app);
  if (t.at === 'sign') initSign(t); else gate();
}

// later = ของที่ขาดแนบเพิ่มทีหลังได้ บอกว่าขาดอะไรแต่ไม่ปิดปุ่ม
function setMiss(btn, miss, later) {
  btn.disabled = !later && miss.length > 0;
  const m = document.getElementById('miss');
  // แต่ละรายการเป็นก้อนห้ามตัดบรรทัด ตัดได้แค่หลังจุลภาค
  if (m) { m.hidden = !miss.length; m.innerHTML = 'ยังขาด ' + miss.map(x => `<span class="nb">${esc(x)}</span>`).join(', ') + (later ? ' <span class="nb">แนบเพิ่มทีหลังได้</span>' : ''); }
}
// ปุ่มหลักเปิดเมื่อของที่ขั้นนั้นต้องมีครบ และบอกให้เห็นว่ายังขาดอะไร ยกเว้นเอกสารประกอบที่ตามมาแนบในขั้นร่างสัญญาได้
function gate() {
  const now = document.getElementById('now'), t = cur();
  if (!now || !t || t.at === 'pre') return;
  const btn = now.querySelector('.btn'); if (!btn) return;
  const miss = [];
  if (t.at === 'response' && !now.querySelector('input[name=ans]:checked')) miss.push('คำตอบของผู้ให้เช่า');
  const need = [...now.querySelectorAll('[data-need]')].filter(b => !b.classList.contains('is-set') && !b.closest('[hidden]'));
  if (t.at === 'docs') { if (need.length) miss.push('เอกสาร ' + need.length + ' รายการ'); return setMiss(btn, miss, true); }
  need.forEach(b => miss.push(b.dataset.need));
  setMiss(btn, miss);
}

function initSign(t) {
  // หยุดการเซ็นแล้ว (คู่สัญญาเปลี่ยน) ขั้นนี้ดูอย่างเดียว ไม่มีช่องเซ็นให้ผูก
  if (t.stop) return;
  const pad = document.getElementById('pad'), send = document.getElementById('send-sign'), idOk = document.getElementById('id-ok');
  const tip = document.getElementById('pad-tip'), mail = document.getElementById('ll-mail');
  const ctx = pad.getContext('2d');
  let drawn = false, down = false, mode = paperOnly(t) ? '2' : (t.mode || '0');
  const pos = e => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const ready = () => {
    const miss = [], linkFirst = mode === '1' && !t.link;
    if (linkFirst) { if (!/^\S+@\S+\.\S+$/.test(mail.value.trim())) miss.push('อีเมลผู้ให้เช่า'); }
    else {
      if (mode === '1' && t.link !== 'signed') miss.push('ลายมือชื่อของผู้ให้เช่าทางลิงก์');
      if (mode !== '1' && !idOk.checked) miss.push('การตรวจบัตรผู้เซ็น');
      if (mode === '0' && !drawn) miss.push('ลายมือชื่อ');
      document.querySelectorAll('#now [data-need]').forEach(b => { if (!b.classList.contains('is-set') && !b.closest('[hidden]')) miss.push(b.dataset.need); });
    }
    send.textContent = linkFirst ? 'ส่งลิงก์ให้ผู้ให้เช่า' : 'ส่งเข้าตรวจ';
    setMiss(send, miss);
  };
  // ปรับผืนวาดให้เท่าขนาดบนจอ ถ้าขนาดเปลี่ยน ลายมือชื่อเดิมใช้ไม่ได้ ต้องเซ็นใหม่ (keepSig = ยังไม่ทิ้งลายมือชื่อที่เก็บไว้)
  const fit = keepSig => {
    const r = pad.getBoundingClientRect(), was = drawn;
    pad.width = Math.round(r.width); pad.height = Math.round(r.height);
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#14213A';
    drawn = false; tip.hidden = false; if (keepSig !== true) t.sig = null; ready();
    return was;
  };
  // ลายมือชื่อเก็บไว้กับงานทันทีที่เซ็น ออกไปรอใบเสร็จแล้วกลับมาไม่ต้องเซ็นซ้ำ ถ้าผืนวาดกว้างเท่าเดิม
  const restore = () => {
    if (!t.sig || t.sig.w !== pad.width) { t.sig = null; return; }
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0); drawn = true; tip.hidden = true; ready(); };
    img.src = t.sig.url;
  };
  idOk.addEventListener('change', () => { t.idOk = idOk.checked; ready(); });
  mail.addEventListener('input', ready);
  pad.addEventListener('pointerdown', e => { down = true; pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
  pad.addEventListener('pointermove', e => { if (!down) return; ctx.lineTo(...pos(e)); ctx.stroke(); if (!drawn) { drawn = true; tip.hidden = true; } ready(); });
  pad.addEventListener('pointerup', () => { down = false; if (drawn) t.sig = { w: pad.width, url: pad.toDataURL() }; });
  document.getElementById('pad-clear').addEventListener('click', fit);
  document.querySelectorAll('#now input[name=mode]').forEach(r => r.addEventListener('change', () => {
    mode = t.mode = r.value;
    // เปลี่ยนวิธีหลังส่งลิงก์แล้ว = ยกเลิกลิงก์เดิม ป้ายสถานะจะตามวิธีที่ใช้จริง
    if (t.link === 'sent' && mode !== '1') { t.link = ''; keep(t); toast('ยกเลิกลิงก์เดิมแล้ว'); return; }
    [0, 1, 2].forEach(i => { document.getElementById('mode-' + i).hidden = String(i) !== mode; });
    document.getElementById('id-wrap').hidden = mode === '1';
    if (mode === '0') { fit(true); restore(); } else ready();
  }));
  initSign.ready = ready;
  window.removeEventListener('resize', initSign.rs);
  initSign.rs = () => {
    if (!document.body.contains(pad) || mode !== '0') return;
    if (Math.round(pad.getBoundingClientRect().width) !== pad.width && fit()) toast('ขนาดจอเปลี่ยน ให้ผู้ให้เช่าเซ็นใหม่');
  };
  window.addEventListener('resize', initSign.rs);
  fit(true); restore();
}

function logTalk(t) {
  const el = document.getElementById('talk'), s = el && el.value.trim();
  if (s) { t.talks.push({ date: fmt(TODAY), note: s }); delete t.dr.talk; }
}
// วาดขั้นใหม่ในตำแหน่งเดิม ถ้าขั้นหดจนทั้งขั้นพอดีจอแต่หัวขั้นมุดใต้แถบหัว (ส่งต่อ CPA แล้ว) เลื่อนหัวขั้นกลับมาชิดใต้แถบหัว
// ขั้นที่ยาวกว่าจอ (ฟอร์มร่างสัญญา บันทึกการเจรจา) คงตำแหน่งเดิม เพราะคนกำลังกรอกอยู่กลางขั้น
function keep(t) {
  const y = scrollY; viewTask(t.id); scrollTo(0, y);
  const now = document.getElementById('now');
  if (!now) return;
  const r = now.getBoundingClientRect(), bar = document.querySelector('.top').getBoundingClientRect().bottom;
  if (r.top < bar && r.height <= innerHeight - bar) scrollToNow(true);
}
function act(t, name, b) {
  // ปุ่มส่งต่อไม้ 2 อยู่ในก้อนไม่ต่อ กดแล้วถือว่าผู้ให้เช่าตอบไม่ต่อ แม้ยังไม่ได้กดบันทึกคำตอบ
  if (name === 'cdc') { logTalk(t); t.rung = 2; t.answer = 'ไม่ต่อ'; keep(t); toast('ส่งสรุปเรื่องต่อไม้ 2 แล้ว'); }
  if (name === 'cpa') { t.cpa = 'sent'; keep(t); toast('ส่งต่อให้ CPA แล้ว'); }
  if (name === 'cpa-back') { t.cpa = 'back'; keep(t); toast('ดึงงานกลับมาแล้ว'); }
  // คนคีย์เป็นคนกดส่ง CPA กรอกครบแล้วส่งตรวจเอง งานไปรอ CDC ตรวจร่างสัญญา
  if (name === 'cpa-done') {
    t.pre = ['บริษัทเป็นผู้ออก', 'ผู้ให้เช่า', 'ไม่รับ', 'มิเตอร์การไฟฟ้า'].map((v, i) => (t.pre || [])[i] || v);
    t.cpa = 'done'; advance(t, 'pre'); viewTask(t.id); toast('CPA กรอกและส่งตรวจแล้ว'); scrollToNow(true);
  }
  // เลยกำหนดตอบ: จดการติดตามรอบนี้ หรือออกหนังสือซ้ำจากข้อมูลเดิม วันส่งใหม่เป็นตัวตั้งของวันครบกำหนดตอบ
  if (name === 'follow') {
    const s = (document.getElementById('f-note') || {}).value || '';
    if (!s.trim()) { toast('พิมพ์สิ่งที่ตามก่อน'); return; }
    t.follows.push({ date: fmt(TODAY), note: s.trim() }); delete t.dr['f-note']; keep(t); toast('บันทึกการติดตามแล้ว');
  }
  if (name === 'resend') { t.follows.push({ date: fmt(TODAY), note: 'ออกหนังสือซ้ำจากข้อมูลเดิม' }); t.sent = TODAY; keep(t); toast('ออกหนังสือซ้ำแล้ว'); }
  // เซ็นต่อไม่ได้: เปิดฟอร์มของทางที่เลือกในที่เดิม ปิดอีกทาง
  if (name === 'open') {
    ['ask', 'party'].forEach(k => { const f = document.getElementById(k + '-form'); f.hidden = k !== b.dataset.form || !f.hidden; });
  }
  // ผู้ให้เช่าขอแก้ตอนเซ็น: คนหน้างานแก้เนื้อหาเองไม่ได้ ยกเลิกรอบเซ็นนี้แล้วงานกลับไปผ่านทางอนุมัติ (3-15)
  if (name === 'ask-go') {
    t.asks.push({ date: fmt(TODAY), note: t.dr['ask-text'].trim() }); delete t.dr['ask-text'];
    Object.assign(t, { mode: '', link: '', mail: '', sig: null, idOk: false, readOpen: false, at: 'review', rv: 0 }); delete t.att.signed;
    viewTask(t.id); toast('ยกเลิกรอบเซ็นแล้ว ส่งกลับไปอนุมัติ'); scrollToNow(true);
  }
  // คู่สัญญาเปลี่ยน: หยุดการเซ็น แจ้ง CDC ตัดสิน งานย้ายไปกลุ่มรอคนอื่น
  if (name === 'party-go') { t.stop = { date: fmt(TODAY), note: t.dr['party-text'].trim() }; delete t.dr['party-text']; keep(t); toast('หยุดการเซ็นแล้ว แจ้ง CDC แล้ว'); }
  // ผู้ให้เช่าปฏิเสธ (รุ่น 9): ส่งขอยกเลิกให้ CDC ยืนยัน งานไม่เดินต่อ ย้ายไปกลุ่มรอคนอื่น
  // กดจากก้อนไม่ต่อของขั้น 02 ถือว่าตอบไม่ต่อแม้ยังไม่กดบันทึกคำตอบ บันทึกการเจรจาที่พิมพ์ค้างไว้เก็บเข้าประวัติด้วย
  if (name === 'open-cancel') { const f = document.getElementById('cancel-form'); f.hidden = !f.hidden; document.getElementById('ext-form').hidden = true; }
  // รุ่น 10: ฟอร์มขอขยายระยะเวลากับฟอร์มขอยกเลิกเปิดทีละอัน
  if (name === 'open-ext') { const f = document.getElementById('ext-form'); f.hidden = !f.hidden; document.getElementById('cancel-form').hidden = true; }
  if (name === 'ext-go') {
    if (t.at === 'response') { logTalk(t); t.answer = 'ไม่ต่อ'; }
    t.cancel = { date: fmt(TODAY), note: t.dr['ext-text'].trim(),
      ext: { months: parseInt(document.getElementById('ext-months').value, 10), rent: numOf(document.getElementById('ext-rent').value) || t.rent } };
    ['ext-text', 'ext-months', 'ext-rent'].forEach(k => delete t.dr[k]);
    keep(t); toast('ส่งเรื่องขยายระยะเวลาให้ CDC แล้ว');
  }
  if (name === 'cancel-go') {
    if (t.at === 'response') { logTalk(t); t.answer = 'ไม่ต่อ'; }
    t.cancel = { date: fmt(TODAY), note: t.dr['cancel-text'].trim() }; delete t.dr['cancel-text'];
    keep(t); toast('ส่งให้ CDC ยืนยันยกเลิกแล้ว');
  }
  if (name === 'cancel-ok') { t.cancel.done = true; keep(t); toast(t.cancel.ext ? 'CDC ยืนยันแล้ว ขยายระยะเวลา' : 'CDC ยืนยันแล้ว งานยกเลิก'); }
  if (name === 'link-signed') { t.link = 'signed'; keep(t); toast('ผู้ให้เช่าเซ็นทางลิงก์แล้ว'); }
  if (name === 'link-cancel') { t.link = ''; keep(t); toast('ยกเลิกลิงก์แล้ว แก้อีเมลแล้วส่งใหม่ได้'); }
  // เปิดปิดสัญญาในที่เดิม ไม่วาดขั้นใหม่ ลายมือชื่อที่กำลังเซ็นจึงไม่หาย
  if (name === 'read') {
    const p = document.getElementById('read-paper');
    p.hidden = !p.hidden; t.readOpen = !p.hidden;
    b.textContent = t.readOpen ? 'ปิดสัญญา' : 'เปิดสัญญาให้ผู้ให้เช่าอ่าน';
  }
}

function advance(t, k) {
  let msg = '';
  if (k === 'letter') {
    t.pTerm = parseInt(document.getElementById('p-term').value, 10);
    t.pRent = numOf(document.getElementById('p-rent').value) || t.rent;
    t.pPay = document.getElementById('p-pay').value;
    // วันที่ส่งที่พิมพ์เป็นตัวตั้งของวันครบกำหนดตอบ อ่านไม่ได้ใช้วันนี้แล้วบอกให้รู้
    const typed = parseTh(document.getElementById('l-date').value);
    t.sent = typed || TODAY; t.track = document.getElementById('l-track').value.trim();
    if (!typed) msg = 'อ่านวันที่ส่งไม่ได้ ใช้วันนี้แทน';
    // รุ่น 10: จำทางส่ง ส่งทางอีเมลไม่มีเลขพัสดุ
    t.via = (document.querySelector('input[name="l-via"]:checked') || {}).value || 'ไปรษณีย์';
    if (t.via === 'อีเมล') { t.lmail = document.getElementById('l-mail').value.trim(); t.track = ''; }
  }
  if (k === 'response') {
    t.answer = (document.querySelector('input[name=ans]:checked') || {}).value;
    t.rvia = (document.querySelector('input[name="r-via"]:checked') || {}).value || t.via;
    // ไม่ต่อ = งานยังอยู่ขั้นนี้ (ใน SAR คือ Waiting for LL Responsed ตามคำเล่า) จนกว่าจะเจรจาได้
    // ผังของคนทำระบบให้ทุกคำตอบไปขั้นเจรจาแล้ววนรอเจรจาที่นั่น ร่างข้อ 40 ถามว่าจริงอยู่ขั้นไหน (รุ่น 9)
    if (t.answer === 'ไม่ต่อ') { logTalk(t); return 'บันทึกแล้ว งานยังอยู่ขั้นนี้'; }
  }
  if (k === 'nego') {
    t.term = parseInt(document.getElementById('ag-term').value, 10);
    t.agRent = numOf(document.getElementById('ag-rent').value) || P(t).rent;
    t.pay = document.getElementById('ag-pay').value;
  }
  if (k === 'pre') { t.term = draftTerm(t); t.dTerm = 0; t.back = ''; t.cheque = (t.pre || [])[2] === 'รับ'; t.rv = 0; }
  if (k === 'sign' && t.mode === '1' && !t.own && !t.link) {
    t.mail = document.getElementById('ll-mail').value.trim(); t.link = 'sent';
    return 'ส่งลิงก์ให้ผู้ให้เช่าแล้ว';
  }
  if (k === 'sign') t.ck = 0;
  t.at = FLOW[idx(k) + 1];
  return msg || { letter: 'บันทึกการส่งแล้ว', response: 'บันทึกคำตอบแล้ว', nego: 'บันทึกผลต่อรองแล้ว', docs: 'บันทึกเอกสารแล้ว', pre: 'ส่งให้ CDC ตรวจแล้ว',
           review: 'สัญญาพร้อมเซ็น', contract: t.own || t.nonstd ? 'แนบสัญญาแล้ว' : 'ออกสัญญาแล้ว', sign: 'ส่งเข้าตรวจแล้ว', check: 'งานเสร็จ' }[k];
}

// เลื่อนให้ขั้นปัจจุบันชิดใต้แถบหัว ถ้าขั้นอยู่ท้ายหน้าจนเลื่อนไม่ถึง เติมที่ว่างท้ายหน้าเท่าที่ขาด
// จอแรกจะไม่มีตัวหนังสือครึ่งบรรทัดติดใต้แถบหัว (ตาใหม่ รุ่น 4 visual-07) คืน false เมื่อไม่มีขั้นปัจจุบัน
// ล้างที่ว่างเดิมหลังด่านไม่ต้องเลื่อนเท่านั้น การเรียกซ้ำตอนฟอนต์โหลดเสร็จจะได้ไม่ล้างที่ว่างที่เพิ่งเติม
// aligned จดว่าหน้านี้เลื่อนไปชิดแล้ว ฟอนต์โหลดเสร็จทีหลังความสูงเปลี่ยน ต้องจัดใหม่ให้ชิดเหมือนเดิม
let aligned = false;
function scrollToNow(force) {
  const now = document.getElementById('now');
  if (!now) { app.style.paddingBottom = ''; aligned = false; return false; }
  if (!force && now.getBoundingClientRect().top <= innerHeight * 0.6) return true;
  app.style.paddingBottom = '';
  const margin = parseFloat(getComputedStyle(now).scrollMarginTop) || 0;
  const short = now.getBoundingClientRect().top + scrollY - margin - (document.documentElement.scrollHeight - innerHeight);
  if (short > 0) app.style.paddingBottom = (parseFloat(getComputedStyle(app).paddingBottom) + short) + 'px';
  now.scrollIntoView({ block: 'start' });
  aligned = true;
  return true;
}
// เปิดงานแล้วต้องเห็นขั้นปัจจุบันเลย ถ้าหัวขั้นอยู่ต่ำกว่า 60% ของจอ เลื่อนขึ้นมาให้ ถ้าเคยเลื่อนชิดแล้วจัดให้ชิดอีกรอบ
function focusNow() {
  scrollToNow(aligned);
}

function render() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  const isTask = p[0] === 'task' && p[1], isList = !isTask && p[0] !== 'about';
  // เปลี่ยนหน้า ที่ว่างท้ายหน้าที่เติมให้งานเดิมไม่ติดมา
  app.style.paddingBottom = ''; aligned = false;
  if (isTask) viewTask(p[1]);
  else if (p[0] === 'about') viewAbout();
  else { setBar(); viewList(); }
  // กลับมาหน้ารายการ คืนตำแหน่งเลื่อนเดิม หน้าอื่นเริ่มบนสุด
  window.scrollTo(0, isList ? listY : 0);
  focusNow();
}

app.addEventListener('click', e => {
  if (e.target.closest('a.row')) { listY = scrollY; return; }
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.filter) { filter = b.dataset.filter; query = ''; document.getElementById('q').value = ''; listRows(); return; }
  const t = cur();
  if (b.hasAttribute('data-doc')) {
    if (t) t.att[b.dataset.doc] = true;
    b.classList.add('is-set'); b.textContent = b.dataset.done || 'แนบแล้ว';
    // ขั้นร่างสัญญาวาดใหม่ทั้งขั้น ผลตรวจก่อนส่งกับรายการเอกสารที่ขาดจะได้ตามทัน
    // ขั้นเซ็นที่ส่งลิงก์แล้ว แนบใบเสร็จครบแล้วขั้นกลายเป็นรอผู้ให้เช่า ต้องวาดใหม่ให้กรอบกับป้ายตาม
    if (t && t.at === 'sign') { if (t.link === 'sent') keep(t); else initSign.ready(); }
    else if (t && t.at === 'pre') keep(t); else gate();
    return;
  }
  if (b.dataset.act) { act(t, b.dataset.act, b); return; }
  if (b.dataset.go) {
    const msg = advance(t, b.dataset.go);
    viewTask(t.id); toast(msg);
    // งานเสร็จแล้วไม่มีขั้นปัจจุบัน กลับขึ้นบนสุดให้เห็นป้ายเสร็จ
    if (!scrollToNow(true)) scrollTo(0, 0);
  }
});
// รุ่น 10: แก้ข้อเสนอแล้วช่องที่เติมให้ในหนังสือกับใบตอบรับเปลี่ยนพร้อมกันทุกช่อง (ตัวอย่างจริงใบตอบรับไม่ตรงกับหนังสือ)
const MARK = { 'p-term': 1, 'p-rent': 1, 'p-pay': 1 };
function letterMarks(t) {
  const term = parseInt(document.getElementById('p-term').value, 10), rent = numOf(document.getElementById('p-rent').value), [s, e] = period(t, term);
  const v = { term: term + ' ปี', from: fmt(s), to: fmt(e), rent: baht(rent), words: thaiWords(rent) + 'บาทถ้วน', pay: document.getElementById('p-pay').value };
  document.querySelectorAll('#now [data-m]').forEach(m => { if (m.dataset.m === 'words') m.innerHTML = wordsHtml(v.words); else m.textContent = v[m.dataset.m]; });
  // เขียนทับแล้วคำประสมในช่อง (บาทต่อปี รายเดือน) หลุดจากก้อนห้ามตัด ห่อใหม่
  keepWords(document.getElementById('now'));
}
app.addEventListener('input', e => {
  const el = e.target, t = cur();
  if (el.id === 'q') { query = el.value; listRows(); return; }
  // ช่องที่ติด data-keep เก็บค่าลงงานทันทีที่พิมพ์หรือเลือก
  if (t && el.hasAttribute('data-keep')) t.dr[el.id] = el.value;
  if (MARK[el.id]) { letterMarks(t); }
  if (el.id === 'ext-text') document.querySelector('[data-act="ext-go"]').disabled = !el.value.trim();
  // ปุ่มยืนยันของทางเซ็นต่อไม่ได้ กับปุ่มส่งขอยกเลิก เปิดเมื่อพิมพ์รายละเอียดแล้ว
  if (el.id === 'ask-text' || el.id === 'party-text' || el.id === 'cancel-text') document.querySelector(`[data-act="${el.id.split('-')[0]}-go"]`).disabled = !el.value.trim();
});
app.addEventListener('change', e => {
  const el = e.target, t = cur();
  if (el.name === 'ans') { t.dr.ans = el.value; document.getElementById('no-renew').hidden = el.value !== 'ไม่ต่อ'; gate(); return; }
  // รุ่น 10: ทางส่งเปลี่ยนช่องที่ต้องกรอก ไปรษณีย์ใช้เลขพัสดุ อีเมลใช้อีเมลผู้ให้เช่า ไม่วาดขั้นใหม่ ค่าที่พิมพ์ค้างไว้ไม่หาย
  if (el.name === 'l-via') { t.dr['l-via'] = el.value; document.getElementById('via-post').hidden = el.value !== 'ไปรษณีย์'; document.getElementById('via-mail').hidden = el.value !== 'อีเมล'; return; }
  if (el.name === 'r-via') { t.dr['r-via'] = el.value; return; }
  if (el.dataset.pre !== undefined) { (t.pre = t.pre || ['', '', '', ''])[+el.dataset.pre] = el.value; keep(t); return; }
  if (el.id === 'd-term') { t.dTerm = parseInt(el.value, 10); keep(t); }
});
// ลิงก์ในแอปเปลี่ยนหน้าด้วยการตั้ง location.hash เอง (01/10/2026) ตัวเปิดไฟล์ HTML ของ SharePoint กับ Teams ดักลิงก์ที่ขึ้นต้นด้วย #
// แล้ว preventDefault ทุกครั้งที่คนกดจริง หน้าจึงค้างที่รายการ ตัวนี้ทำงานช่วง capture ก่อนตัวดักนั้น ผลเหมือนกดลิงก์ปกติทุกที่
// ตัวตรวจ present/check_sharepoint_frame.py (กรอบจำลองจากของที่เก็บจาก SharePoint จริง)
document.addEventListener('click', e => {
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  const h = a.getAttribute('href');
  if (location.hash !== h) location.hash = h;
}, true);
window.addEventListener('hashchange', render);
render();
document.fonts.ready.then(focusNow);
</script>
</body>
